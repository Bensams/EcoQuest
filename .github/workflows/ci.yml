name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `npm run build` compiles crates/game-wasm first, so this job needs the
      # wasm target and a wasm-bindgen CLI matching the wasm-bindgen crate in
      # Cargo.lock. Mismatched versions fail the build with a schema error.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      - run: npm install
      - run: npm run lint
      - run: npm run build
      # web/public/game/ is committed so Vercel can build without Rust. The
      # build above regenerates it, so any diff means the committed copy no
      # longer matches crates/game-wasm and would ship stale behaviour.
      - name: Check the committed wasm is up to date
        run: |
          if ! git diff --quiet -- public/game; then
            echo "web/public/game is stale. Run 'npm run build:wasm' in web/ and commit the result."
            git diff --stat -- public/game
            exit 1
          fi
