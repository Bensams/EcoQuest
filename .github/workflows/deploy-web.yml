name: Deploy web

# Builds the client and publishes it to Vercel.
#
# The build runs here rather than in Vercel's build image because
# `npm run build` compiles crates/game-wasm to WebAssembly first, which needs
# the Rust toolchain and a wasm-bindgen matching the version pinned in
# Cargo.lock -- the same setup the CI web job uses. The result is uploaded with
# `vercel deploy --prebuilt`, so Vercel runs no build of its own.
#
# Requires these repository settings:
#   secrets.VERCEL_TOKEN       a Vercel access token
#   secrets.VERCEL_ORG_ID      from .vercel/project.json after `vercel link`
#   secrets.VERCEL_PROJECT_ID  likewise
#   vars.API_ORIGIN            the Cloud Run origin, e.g.
#                              https://ecoquest-api-abc123-as.a.run.app
#                              (no trailing slash, no /api suffix)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'crates/game-wasm/**'
      - 'Cargo.lock'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127

      # Stop early rather than publishing a client whose API calls 404.
      - name: Require the API origin
        run: |
          if [ -z "${{ vars.API_ORIGIN }}" ]; then
            echo "Repository variable API_ORIGIN is not set."
            echo "Set it to the Cloud Run origin, e.g. https://ecoquest-api-….a.run.app"
            exit 1
          fi

      - run: npm ci || npm install
        working-directory: web
      - run: npm run build
        working-directory: web

      # Vercel Build Output API v3. Routes are generated here, rather than kept
      # in a checked-in vercel.json, so the API origin has exactly one source of
      # truth and no placeholder can be left unreplaced.
      #
      # Ordering matters: /api/* proxies to Cloud Run before "filesystem" runs,
      # and the SPA fallback only applies to paths no real file matched.
      - name: Assemble Vercel build output
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          mkdir -p .vercel/output
          cp -r web/dist .vercel/output/static
          cat > .vercel/output/config.json <<JSON
          {
            "version": 3,
            "routes": [
              {
                "src": "^/api/(.*)$",
                "dest": "${API_ORIGIN}/api/\$1",
                "check": false
              },
              {
                "src": "^/(art|game)/(.*)$",
                "headers": { "cache-control": "public, max-age=31536000, immutable" },
                "continue": true
              },
              {
                "src": "^/.*$",
                "headers": {
                  "x-frame-options": "DENY",
                  "x-content-type-options": "nosniff",
                  "referrer-policy": "strict-origin-when-cross-origin"
                },
                "continue": true
              },
              { "handle": "filesystem" },
              { "src": "^/.*$", "dest": "/index.html" }
            ]
          }
          JSON
          node -e "JSON.parse(require('fs').readFileSync('.vercel/output/config.json','utf8'));console.log('config.json is valid JSON')"

      - name: Publish to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"
